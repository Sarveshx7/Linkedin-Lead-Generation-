spring.application.name=lead-discovery
server.port=${PORT:8080}

# Supabase PostgreSQL Datasource Configuration (Session Pooler)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=${SUPABASE_DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional Reddit OAuth API Credentials (Free personal script app)
lead.collector.reddit.client-id=${REDDIT_CLIENT_ID:}
lead.collector.reddit.client-secret=${REDDIT_CLIENT_SECRET:}
lead.collector.reddit.user-agent=${REDDIT_USER_AGENT:LeadDiscoverySystem/1.0 (Authorized lead ingest)}

# Optional public search provider keys. Every configured provider receives each campaign query.
# No LinkedIn session cookies or private endpoints are used.
lead.collector.linkedin.tavily-api-key=${TAVILY_API_KEY:}
lead.collector.linkedin.exa-api-key=${EXA_API_KEY:}
lead.collector.linkedin.serper-api-key=${SERPER_API_KEY:}
